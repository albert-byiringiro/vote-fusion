services:
  - type: redis
    name: votefusion-redis
    ipAllowList: []
    plan: free
    maxmemoryPolicy: noeviction
    region: frankfurt

  - type: web
    name: votefusion-api
    env: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: cd server && NODE_PATH=../shared/dist node dist/main
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: CLIENT_URL
        value: https://votefusion-client.onrender.com
      - key: REDIS_HOST
        fromService:
          type: redis
          name: votefusion-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: votefusion-redis
          property: port
      - key: REDIS_PASSWORD
        fromService:
          type: redis
          name: votefusion-redis
          property: password
    disk:
      name: tmp
      mountPath: /tmp
      sizeGB: 1

  - type: web
    name: votefusion-client
    env: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: cd client && npm run serve
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://votefusion-api.onrender.com
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

routes:
  - type: redirect
    source: www.votefusion.com/*
    destination: votefusion.com/$1
    status: 301

  - type: rewrite
    source: /*
    destination: /index.html
    condition:
      pathPattern: ^(?!/api|/assets|/static).*$

deploy:
  healthCheck:
    startPeriod: 60
    interval: 30
    timeout: 5
    retries: 3

  notifications:
    email:
      success: true
      failure: true